<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>猫耳律动 · 逐字歌词转换</title>
    <style>
      :root {
        --bg: #0e1218;
        --card: rgba(22, 30, 42, 0.88);
        --line: rgba(140, 160, 190, 0.22);
        --text: #e8eef6;
        --muted: #9aa8b8;
        --accent: #8ec5ff;
        --ok: #7dcea0;
        --warn: #e6b35a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 28px 18px 48px;
        color: var(--text);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(1000px 520px at 12% -8%, rgba(120, 170, 230, 0.16), transparent 55%),
          radial-gradient(800px 420px at 100% 0%, rgba(80, 120, 160, 0.12), transparent 50%),
          var(--bg);
      }
      .wrap { max-width: 720px; margin: 0 auto; }
      h1 { margin: 0; font-size: 1.35rem; letter-spacing: 0.04em; }
      .sub { margin: 8px 0 0; color: var(--muted); font-size: 0.92rem; line-height: 1.55; }
      .card {
        margin-top: 18px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
      }
      .drop {
        border: 1.5px dashed rgba(142, 197, 255, 0.35);
        border-radius: 12px;
        padding: 28px 16px;
        text-align: center;
        color: var(--muted);
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      .drop:hover, .drop.is-over {
        border-color: var(--accent);
        background: rgba(142, 197, 255, 0.06);
        color: var(--text);
      }
      .modes { display: grid; gap: 10px; margin-top: 14px; }
      label.mode {
        display: flex; gap: 10px; align-items: flex-start;
        padding: 10px 12px; border-radius: 10px;
        border: 1px solid transparent; cursor: pointer;
      }
      label.mode:has(input:checked) {
        border-color: rgba(142, 197, 255, 0.35);
        background: rgba(142, 197, 255, 0.08);
      }
      label.mode strong { display: block; margin-bottom: 2px; }
      label.mode span { color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
      button, .file-btn {
        appearance: none; border: 0; border-radius: 10px; cursor: pointer;
        padding: 10px 14px; font-weight: 600; font-size: 0.95rem;
        background: rgba(100, 160, 230, 0.22); color: #d7ebff;
        border: 1px solid rgba(140, 180, 230, 0.35);
      }
      button.primary { background: rgba(100, 170, 255, 0.35); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .status { margin-top: 12px; min-height: 1.4em; color: var(--muted); font-size: 0.92rem; }
      .status.ok { color: var(--ok); }
      .status.err { color: #f0a0a0; }
      pre {
        margin: 12px 0 0; max-height: 220px; overflow: auto;
        padding: 12px; border-radius: 10px;
        background: rgba(0, 0, 0, 0.28); color: #c5d0dc;
        font-size: 0.82rem; line-height: 1.45; white-space: pre-wrap;
      }
      code {
        padding: 1px 6px; border-radius: 6px;
        background: rgba(255, 255, 255, 0.06); font-size: 0.9em;
      }
      a { color: var(--accent); }
      .hint { margin-top: 10px; color: var(--warn); font-size: 0.88rem; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>逐字歌词转换</h1>
      <p class="sub">
        把 LDDC 等工具导出的逐字 LRC，整理成猫耳律动可直接用的格式（整句显示 + 保留逐字时间轴）。
        <strong>猫耳律动本身已能直接读 LDDC 原文件</strong>；此工具用于改名、规范化，或导出「仅逐句」给其他软件。
      </p>

      <section class="card">
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="选择或拖入 LRC 文件">
          点击选择，或把 <code>.lrc</code> 拖到这里<br />
          <small id="fileName">尚未选择文件</small>
        </div>
        <input type="file" id="fileInput" accept=".lrc,.txt,text/plain" hidden multiple />

        <div class="modes">
          <label class="mode">
            <input type="radio" name="mode" value="enhanced" checked />
            <div>
              <strong>猫耳律动用（推荐）</strong>
              <span>保留每个字的时间轴，整理成标准增强 LRC；按「歌名-歌手.lrc」命名下载。</span>
            </div>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="line" />
            <div>
              <strong>仅逐句（给别的播放器）</strong>
              <span>每句只留一个时间戳，会失去逐字对齐精度。</span>
            </div>
          </label>
        </div>

        <div class="actions">
          <button type="button" class="primary" id="convertBtn" disabled>转换并下载</button>
          <button type="button" id="previewBtn" disabled>预览</button>
        </div>
        <p class="status" id="status"></p>
        <p class="hint">批量：可一次选多个文件，会分别下载。</p>
        <pre id="preview" hidden></pre>
      </section>

      <section class="card">
        <p class="sub" style="margin:0">
          也可用命令行：把 LRC 拖到同目录的 <code>转换逐字歌词.bat</code>，或运行
          <code>python tools_lrc_convert.py 某首歌.lrc</code>
        </p>
      </section>
    </main>

    <script>
      (function () {
        const drop = document.getElementById("drop");
        const fileInput = document.getElementById("fileInput");
        const fileName = document.getElementById("fileName");
        const convertBtn = document.getElementById("convertBtn");
        const previewBtn = document.getElementById("previewBtn");
        const status = document.getElementById("status");
        const preview = document.getElementById("preview");
        let files = [];

        function setStatus(text, kind) {
          status.textContent = text || "";
          status.className = "status" + (kind ? " " + kind : "");
        }

        function parseClock(min, sec, frac) {
          const ms = String(frac || "0").padEnd(3, "0").slice(0, 3);
          return Number(min) * 60 + Number(sec) + Number(ms) / 1000;
        }

        function fmtTag(sec, angle) {
          const t = Math.max(0, sec);
          const m = Math.floor(t / 60);
          const s = t - m * 60;
          const whole = Math.floor(s);
          const ms = Math.round((s - whole) * 1000);
          const body =
            String(m).padStart(2, "0") +
            ":" +
            String(whole).padStart(2, "0") +
            "." +
            String(ms).padStart(3, "0");
          return angle ? "<" + body + ">" : "[" + body + "]";
        }

        function metaOf(text) {
          const out = { ti: "", ar: "", al: "", rows: [] };
          String(text || "")
            .replace(/^\uFEFF/, "")
            .split(/\r?\n/)
            .forEach((raw) => {
              const row = raw.trim();
              if (!row) return;
              const m = row.match(/^\[(ti|ar|al|by|offset|from|length|tool):(.*)\]$/i);
              if (m) {
                const k = m[1].toLowerCase();
                if (k === "ti") out.ti = m[2].trim();
                if (k === "ar") out.ar = m[2].trim();
                if (k === "al") out.al = m[2].trim();
                if (k !== "tool") out.rows.push(row);
                return;
              }
              out.rows.push(raw);
            });
          return out;
        }

        function parseAngleLine(row) {
          const re = /<(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?>([^<]*)/g;
          const words = [];
          let end = null;
          let m;
          while ((m = re.exec(row))) {
            const time = parseClock(m[1], m[2], m[3]);
            const text = m[4] == null ? "" : String(m[4]);
            if (text.length) words.push({ time, text });
            else end = time;
          }
          if (words.length < 2) return null;
          return { words, end };
        }

        function parseBracketEnhanced(row) {
          const re = /\[(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?\]([^\[]*)/g;
          const segs = [];
          let m;
          while ((m = re.exec(row))) {
            segs.push({
              time: parseClock(m[1], m[2], m[3]),
              text: m[4] == null ? "" : String(m[4])
            });
          }
          const content = segs.filter((s) => String(s.text || "").length > 0);
          if (content.length < 2) return null;
          const shortN = content.filter((s) => String(s.text).trim().length <= 2).length;
          if (shortN < Math.ceil(content.length * 0.6)) return null;
          const words = content.map((s) => ({
            time: s.time,
            text: String(s.text).replace(/<[^>]+>/g, "")
          })).filter((w) => w.text.length);
          if (words.length < 2) return null;
          const trailing = segs.filter((s) => !String(s.text || "").length);
          const end = trailing.length ? trailing[trailing.length - 1].time : null;
          return { words, end };
        }

        function coalesceChars(items) {
          if (items.length < 10) return null;
          if (items.some((e) => e.words && e.words.length >= 2)) return null;
          const shortN = items.filter((e) => [...String(e.text || "")].length <= 2).length;
          if (shortN < items.length * 0.8) return null;
          const gaps = [];
          for (let i = 1; i < items.length; i++) gaps.push(items[i].time - items[i - 1].time);
          gaps.sort((a, b) => a - b);
          const median = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 0.3;
          const breakGap = Math.max(0.95, median * 2.8);
          const out = [];
          let cur = null;
          for (const ev of items) {
            const piece = String(ev.text || "");
            if (!cur) {
              cur = { words: [{ time: ev.time, text: piece }], end: null };
              continue;
            }
            const prev = cur.words[cur.words.length - 1].time;
            if (ev.time - prev >= breakGap) {
              cur.end = prev + Math.min(Math.max((ev.time - prev) * 0.35, 0.25), 0.9);
              out.push(cur);
              cur = { words: [{ time: ev.time, text: piece }], end: null };
            } else {
              cur.words.push({ time: ev.time, text: piece });
            }
          }
          if (cur) out.push(cur);
          return out.length ? out : null;
        }

        function extractLines(text) {
          const meta = metaOf(text);
          const lines = [];
          const singles = [];
          for (const raw of meta.rows) {
            const row = String(raw || "").trim();
            if (!row || /^\[(ti|ar|al|by|offset|from|length|tool):/i.test(row)) continue;

            let parsed = null;
            if (/<\d{1,2}:\d{1,2}/.test(row)) parsed = parseAngleLine(row);
            if (!parsed) parsed = parseBracketEnhanced(row);
            if (parsed) {
              lines.push(parsed);
              continue;
            }

            const re = /\[(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?\]([^\[]*)/g;
            let m;
            let any = false;
            while ((m = re.exec(row))) {
              any = true;
              const t = parseClock(m[1], m[2], m[3]);
              const tx = String(m[4] || "").replace(/<[^>]+>/g, "").trim();
              if (tx) singles.push({ time: t, text: tx });
            }
            if (!any && row) singles.push({ time: -1, text: row });
          }

          if (!lines.length && singles.length) {
            const merged = coalesceChars(singles.filter((s) => s.time >= 0));
            if (merged) return { meta, lines: merged };
            return {
              meta,
              lines: singles
                .filter((s) => s.time >= 0 && s.text)
                .map((s) => ({ words: [{ time: s.time, text: s.text }], end: null }))
            };
          }
          return { meta, lines };
        }

        function buildEnhanced(meta, lines) {
          const head = [];
          if (meta.ti) head.push("[ti:" + meta.ti + "]");
          if (meta.ar) head.push("[ar:" + meta.ar + "]");
          if (meta.al) head.push("[al:" + meta.al + "]");
          head.push("[tool:猫耳律动 lrc-convert]");
          head.push("");
          const body = lines.map((line) => {
            const words = line.words || [];
            if (!words.length) return "";
            let row = fmtTag(words[0].time, false);
            for (const w of words) {
              row += fmtTag(w.time, true) + w.text;
            }
            if (line.end != null) row += fmtTag(line.end, true);
            return row;
          }).filter(Boolean);
          return head.concat(body).join("\n") + "\n";
        }

        function buildLineOnly(meta, lines) {
          const head = [];
          if (meta.ti) head.push("[ti:" + meta.ti + "]");
          if (meta.ar) head.push("[ar:" + meta.ar + "]");
          if (meta.al) head.push("[al:" + meta.al + "]");
          head.push("[tool:猫耳律动 lrc-convert line-only]");
          head.push("");
          const body = lines.map((line) => {
            const words = line.words || [];
            if (!words.length) return "";
            const text = words.map((w) => w.text).join("");
            return fmtTag(words[0].time, false) + text;
          }).filter(Boolean);
          return head.concat(body).join("\n") + "\n";
        }

        function safeName(meta, fallback) {
          const ti = (meta.ti || "").replace(/[\\/:*?"<>|]/g, "").trim();
          const ar = (meta.ar || "").replace(/[\\/:*?"<>|]/g, "").trim();
          if (ti && ar) return ti + "-" + ar + ".lrc";
          if (ti) return ti + ".lrc";
          return (fallback || "lyrics").replace(/\.lrc$/i, "") + ".lrc";
        }

        function mode() {
          return (document.querySelector('input[name="mode"]:checked') || {}).value || "enhanced";
        }

        function convertOne(text, fileLabel) {
          const { meta, lines } = extractLines(text);
          if (!lines.length) throw new Error("没有识别到歌词行");
          const out =
            mode() === "line" ? buildLineOnly(meta, lines) : buildEnhanced(meta, lines);
          return {
            text: out,
            name: safeName(meta, fileLabel),
            lineCount: lines.length,
            wordCount: lines.reduce((n, l) => n + (l.words ? l.words.length : 0), 0)
          };
        }

        function downloadText(name, text) {
          const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }

        function onFiles(list) {
          files = Array.from(list || []).filter((f) => /\.(lrc|txt)$/i.test(f.name) || !f.name.includes("."));
          if (!files.length) {
            fileName.textContent = "尚未选择文件";
            convertBtn.disabled = true;
            previewBtn.disabled = true;
            return;
          }
          fileName.textContent =
            files.length === 1 ? files[0].name : "已选 " + files.length + " 个文件";
          convertBtn.disabled = false;
          previewBtn.disabled = false;
          setStatus("");
          preview.hidden = true;
        }

        drop.addEventListener("click", () => fileInput.click());
        drop.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") fileInput.click();
        });
        fileInput.addEventListener("change", () => onFiles(fileInput.files));
        ["dragenter", "dragover"].forEach((ev) => {
          drop.addEventListener(ev, (e) => {
            e.preventDefault();
            drop.classList.add("is-over");
          });
        });
        ["dragleave", "drop"].forEach((ev) => {
          drop.addEventListener(ev, (e) => {
            e.preventDefault();
            drop.classList.remove("is-over");
          });
        });
        drop.addEventListener("drop", (e) => onFiles(e.dataTransfer.files));

        previewBtn.addEventListener("click", async () => {
          try {
            const f = files[0];
            const text = await f.text();
            const result = convertOne(text, f.name);
            preview.hidden = false;
            preview.textContent = result.text.split(/\r?\n/).slice(0, 18).join("\n") + "\n…";
            setStatus(
              "预览：" + result.lineCount + " 句 / " + result.wordCount + " 字时间点 → " + result.name,
              "ok"
            );
          } catch (err) {
            setStatus(err.message || "预览失败", "err");
          }
        });

        convertBtn.addEventListener("click", async () => {
          let ok = 0;
          const errors = [];
          for (const f of files) {
            try {
              const text = await f.text();
              const result = convertOne(text, f.name);
              downloadText(result.name, result.text);
              ok += 1;
            } catch (err) {
              errors.push(f.name + ": " + (err.message || "失败"));
            }
          }
          if (ok && !errors.length) {
            setStatus("已转换并下载 " + ok + " 个文件。可直接上传到猫耳律动共同曲库。", "ok");
          } else if (ok) {
            setStatus("成功 " + ok + " 个；" + errors[0], "err");
          } else {
            setStatus(errors[0] || "转换失败", "err");
          }
        });
      })();
    </script>
  </body>
</html>
